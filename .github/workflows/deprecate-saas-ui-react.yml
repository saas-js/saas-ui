name: Deprecate @saas-ui/react

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan first, then rerun with apply and the reported digest
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply
      execute:
        description: Must be enabled for apply mode
        type: boolean
        required: true
        default: false
      react_version:
        description:
          Exact final compatibility version used for artifact evidence; all
          published React versions are targeted
        type: string
        required: true
      cli_version:
        description: Exact published replacement CLI version
        type: string
        required: true
      preset_version:
        description: Exact published replacement preset version
        type: string
        required: true
      channel:
        description:
          Dist-tag that must point to the final compatibility and replacement
          versions
        type: choice
        required: true
        default: next
        options:
          - next
          - latest
      plan_digest:
        description: Digest from a plan run at this same v3 control commit
        type: string
        required: false
      confirmation:
        description: Exact commit-bound confirmation from that plan run
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: npm-deprecate-saas-ui-react
  cancel-in-progress: false

jobs:
  plan:
    name: Snapshot all published versions and build immutable plan
    if: ${{ github.ref == 'refs/heads/v3' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.plan.outputs.digest }}
      confirmation: ${{ steps.plan.outputs.confirmation }}
      target_count: ${{ steps.plan.outputs.target_count }}
    steps:
      - name: Checkout v3 release controls
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Pin npm with deprecation dry-run support
        run: npm install --global npm@11.6.2

      - name: Build read-only deprecation plan
        id: plan
        run: >-
          node --experimental-strip-types tooling/registry/react-deprecation.ts
          plan
        env:
          SAAS_UI_REACT_VERSION: ${{ inputs.react_version }}
          SAAS_UI_CLI_VERSION: ${{ inputs.cli_version }}
          SAAS_UI_PRESET_VERSION: ${{ inputs.preset_version }}
          SAAS_UI_RELEASE_CHANNEL: ${{ inputs.channel }}
          SAAS_UI_DEPRECATION_CONTROL_COMMIT: ${{ github.sha }}

  deprecate:
    name: Deprecate the approved complete exact-version set
    if: ${{ inputs.mode == 'apply' && github.ref == 'refs/heads/v3' }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: npm-deprecation
    steps:
      - name: Checkout v3 release controls
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Pin npm with deprecation dry-run support
        run: npm install --global npm@11.6.2

      - name: Require explicit execution switch
        run: |
          if [ "$SAAS_UI_DEPRECATION_EXECUTE" != "true" ]; then
            echo "Apply mode requires the execute checkbox."
            exit 1
          fi
        env:
          SAAS_UI_DEPRECATION_EXECUTE: ${{ inputs.execute }}

      - name:
          Revalidate set, dry-run and apply each exact version, and post-verify
        run: >-
          node --experimental-strip-types tooling/registry/react-deprecation.ts
          apply
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DEPRECATE_TOKEN }}
          SAAS_UI_REACT_VERSION: ${{ inputs.react_version }}
          SAAS_UI_CLI_VERSION: ${{ inputs.cli_version }}
          SAAS_UI_PRESET_VERSION: ${{ inputs.preset_version }}
          SAAS_UI_RELEASE_CHANNEL: ${{ inputs.channel }}
          SAAS_UI_DEPRECATION_PLAN_DIGEST: ${{ inputs.plan_digest }}
          SAAS_UI_DEPRECATION_CONFIRMATION: ${{ inputs.confirmation }}
          SAAS_UI_DEPRECATION_EXECUTE: ${{ inputs.execute }}
          SAAS_UI_DEPRECATION_CONTROL_COMMIT: ${{ github.sha }}
