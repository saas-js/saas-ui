name: Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build, registry, and tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm i --ignore-scripts

      - name: Build packages
        run: pnpm build:packages

      - name: Build tokens
        run: pnpm build:tokens

      - name: Validate registry, CLI, and generated consumer
        run: pnpm registry:ci

      - name: Typecheck migrated dogfood applications
        run: |
          pnpm --dir apps/compositions typecheck
          pnpm --dir apps/compositions typecheck:dogfood
          pnpm --dir apps/website typecheck

      - name: Build migrated website
        run: pnpm --dir apps/website build

      - name: Run tests
        run: pnpm test:ci
